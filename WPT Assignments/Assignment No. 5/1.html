<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Finder | API Assignment</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="display-4">Library Search</h1>
            <p class="lead">Find your favorite books using the Open Library API</p>
        </div>

        <!-- User Interaction: Search Bar -->
        <div class="row justify-content-center mb-4">
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search for a book title...">
                    <button class="btn btn-primary" id="searchBtn">Search</button>
                </div>
            </div>
        </div>

        <!-- Loading State: Spinner -->
        <div id="loader" class="text-center d-none my-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2">Fetching live data...</p>
        </div>

        <!-- Error Handling Display -->
        <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>

        <!-- DOM Manipulation Target: Results Area -->
        <div id="resultsArea" class="row row-cols-1 row-cols-md-3 g-4"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
