<!DOCTYPE html>
<html>
<body>
    <select id="colorSelect">
        <option>Red</option>
        <option>Green</option>
        <option>Blue</option>
        <option>White</option>
    </select>
    <button onclick="removeColor()">Remove Selected</button>

    <script>
        function removeColor() {
            let x = document.getElementById("colorSelect");
            x.remove(x.selectedIndex);
        }
    </script>
</body>
</html>
