<!DOCTYPE html>
<html>
<body>
    <p id="text">It is rightly said that being disciplined is essential in life. 
        When a person leads a disciplined life, they set an easy path to success...</p>
    
    <button onclick="js_style()">Modify Style</button>

    <script>
        function js_style() {
            let p = document.getElementById('text');
            p.style.fontFamily = "Verdana, sans-serif";
            p.style.fontSize = "24px";
            p.style.color = "blue";
        }
    </script>
</body>
</html>
