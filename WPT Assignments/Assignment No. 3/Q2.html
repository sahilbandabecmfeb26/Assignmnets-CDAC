<!DOCTYPE html>
<html>
<body>
    <form id="userForm">
        First Name: <input type="text" id="fname"><br><br>
        Last Name: <input type="text" id="lname"><br><br>
        Contact No: <input type="text" id="contact"><br><br>
        Email ID: <input type="email" id="email"><br><br>
        <button type="button" onclick="getFormValues()">Submit</button>
    </form>

    <div id="displayArea" style="margin-top: 20px; font-weight: bold;"></div>

    <script>
        function getFormValues() {
            const fname = document.getElementById('fname').value;
            const lname = document.getElementById('lname').value;
            const contact = document.getElementById('contact').value;
            const email = document.getElementById('email').value;

            document.getElementById('displayArea').innerHTML = 
                `Results: ${fname} ${lname}, ${contact}, ${email}`;
        }
    </script>
</body>
</html>
